name: Downstream patch stack

on:
  push:
    branches:
      - downstream/main
  pull_request:
    branches:
      - downstream/main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify feature packages and patch stack
        run: python downstream/scripts/verify.py
